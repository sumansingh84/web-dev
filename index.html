<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <title>CSS types demo</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
        
        h3 {
            background-color: rgb(52, 234, 73);
            color: rgb(38, 165, 194);

<body>
    <h1 style="background-color: rgb(96, 34, 196); color: rgb(181, 8, 103);">Inline CSS (h1)</h1>

    <h2>External CSS (h2)</h2>
